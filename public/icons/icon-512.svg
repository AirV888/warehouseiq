<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" fill="#0D1B2A" rx="64"/>

  <!-- Warehouse building -->
  <!-- Roof triangle -->
  <polygon points="40,235 256,75 472,235" fill="none" stroke="#00B894" stroke-width="18" stroke-linejoin="round"/>
  <!-- Building body -->
  <rect x="72" y="235" width="368" height="210" fill="none" stroke="#00B894" stroke-width="18" rx="4"/>
  <!-- Left window -->
  <rect x="112" y="278" width="76" height="60" fill="#00B894" rx="8"/>
  <!-- Right window -->
  <rect x="324" y="278" width="76" height="60" fill="#00B894" rx="8"/>
  <!-- Door -->
  <rect x="208" y="328" width="96" height="117" fill="#00B894" rx="8"/>

  <!-- "IQ" lettering on door -->
  <text x="256" y="406" text-anchor="middle" font-family="'Courier New', monospace" font-size="54" font-weight="900" fill="#0D1B2A" letter-spacing="6">IQ</text>
</svg>
