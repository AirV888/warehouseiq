<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Background -->
  <rect width="192" height="192" fill="#0D1B2A" rx="24"/>

  <!-- Warehouse building -->
  <!-- Roof triangle -->
  <polygon points="16,88 96,28 176,88" fill="none" stroke="#00B894" stroke-width="7" stroke-linejoin="round"/>
  <!-- Building body -->
  <rect x="28" y="88" width="136" height="80" fill="none" stroke="#00B894" stroke-width="7" rx="2"/>
  <!-- Left window -->
  <rect x="44" y="104" width="28" height="22" fill="#00B894" rx="3"/>
  <!-- Right window -->
  <rect x="120" y="104" width="28" height="22" fill="#00B894" rx="3"/>
  <!-- Door -->
  <rect x="78" y="124" width="36" height="44" fill="#00B894" rx="3"/>

  <!-- "IQ" lettering on door -->
  <text x="96" y="153" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" font-weight="900" fill="#0D1B2A" letter-spacing="2">IQ</text>
</svg>
